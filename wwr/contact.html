<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Wild Water Rafting</title>
  <meta name="description" content="Contact Wild Water Rafting to book a trip or ask a question. Find our address, phone, email, map and a quick message form.">
  <meta name="author" content="Martin Biaya Mutombo">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Wild Water Rafting logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <section class="contact-info">
      <h2>Find Us</h2>
      <address>
        <strong>Wild Water Rafting</strong><br>
        123 River Road<br>
        Jinja, Uganda<br>
        Phone: <a href="tel:+15551234567">(555) 123-4567</a><br>
        Email: <a href="mailto:info@wildwaterrafting.example">info@wildwaterrafting.example</a>
      </address>
      <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d255340.65482279565!2d33.214668!3d0.445467!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177e7b862c391f47%3A0x300fe90f956a9f4a!2sJinja%2C%20Uganda!5e0!3m2!1sen!2sus!4v1795568625684!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>

    <section class="team">
      <h2>Meet Our Team</h2>
      <figure>
        <img src="images/employee1.jpg" alt="Portrait of Sam Rivers, lead river guide">
        <figcaption><strong>Sam Rivers</strong><span>Lead River Guide</span></figcaption>
      </figure>
      <figure>
        <img src="images/employee2.jpg" alt="Portrait of Amina Okello, reservations manager">
        <figcaption><strong>Amina Okello</strong><span>Reservations Manager</span></figcaption>
      </figure>
      <figure>
        <img src="images/employee3.jpg" alt="Portrait of Daniel Kato, safety coordinator">
        <figcaption><strong>Daniel Kato</strong><span>Safety Coordinator</span></figcaption>
      </figure>
    </section>

    <section class="contact-form">
      <h2>Send Us a Message</h2>
      <form action="#" method="post">
        <div>
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div>
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <fieldset>
          <legend>Purpose of Your Message</legend>
          <div class="option">
            <input type="radio" id="general" name="purpose" value="general" checked>
            <label for="general">General Inquiry</label>
          </div>
          <div class="option">
            <input type="radio" id="reservation" name="purpose" value="reservation">
            <label for="reservation">Reservation Question</label>
          </div>
          <div class="option">
            <input type="radio" id="suggestion" name="purpose" value="suggestion">
            <label for="suggestion">Website Suggestion</label>
          </div>
        </fieldset>

        <div>
          <label for="message">Your Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <div class="option">
          <input type="checkbox" id="newsletter" name="newsletter" value="yes">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit">Send My Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 | Wild Water Rafting | Martin Biaya Mutombo</p>
    <nav class="socialmedia">
      <a href="https://www.facebook.com/"><img src="images/facebook.png" alt="Facebook"></a>
      <a href="https://www.linkedin.com/"><img src="images/linkedin.png" alt="LinkedIn"></a>
      <a href="https://www.instagram.com/"><img src="images/instagram.png" alt="Instagram"></a>
    </nav>
  </footer>
</body>
</html>
