<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us | Wild Water Rafting</title>
  <meta name="description" content="Discover Wild Water Rafting: our story, our mission, and the thrilling river adventures that await you.">
  <meta name="author" content="Martin Biaya Mutombo">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Wild Water Rafting logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <div class="contact-intro">
      <h1>Wild Water Rafting Company</h1>
      <address>
        123 Main River Street<br>
        Kolob, California<br>
        <a href="tel:+19999999999">+1 999 999 9999</a><br>
        <a href="mailto:info@whitewater.com">info@whitewater.com</a>
      </address>
    </div>

    <div class="contact-layout">
      <iframe src="https://www.google.com/maps?q=123+Main+River+Street,+Kolob,+California&amp;output=embed" title="Map showing the location of Wild Water Rafting" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>

      <form action="#" method="post">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <fieldset>
          <legend>Message Purpose</legend>
          <div class="options">
            <div class="option">
              <input type="radio" id="general" name="purpose" value="general" checked>
              <label for="general">General Inquiry</label>
            </div>
            <div class="option">
              <input type="radio" id="reservation" name="purpose" value="reservation">
              <label for="reservation">Reservation Question</label>
            </div>
            <div class="option">
              <input type="radio" id="suggestion" name="purpose" value="suggestion">
              <label for="suggestion">Website Suggestion</label>
            </div>
          </div>
        </fieldset>

        <div class="message">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Type here" required></textarea>
        </div>

        <div class="option">
          <input type="checkbox" id="newsletter" name="newsletter" value="yes">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit">Get in Touch!</button>
      </form>
    </div>

    <section class="team">
      <h2>We Are Here to Serve You</h2>
      <figure>
        <img src="images/employee1.jpg" alt="Portrait of Sam Rivers, lead river guide">
        <figcaption><strong>Sam Rivers</strong><span>Lead River Guide</span></figcaption>
      </figure>
      <figure>
        <img src="images/employee2.jpg" alt="Portrait of Amina Okello, reservations manager">
        <figcaption><strong>Amina Okello</strong><span>Reservations Manager</span></figcaption>
      </figure>
      <figure>
        <img src="images/employee3.jpg" alt="Portrait of Daniel Kato, safety coordinator">
        <figcaption><strong>Daniel Kato</strong><span>Safety Coordinator</span></figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 | Wild Water Rafting | Martin Biaya Mutombo</p>
    <nav class="socialmedia">
      <a href="https://www.facebook.com/"><img src="images/facebook.png" alt="Facebook"></a>
      <a href="https://www.linkedin.com/"><img src="images/linkedin.png" alt="LinkedIn"></a>
      <a href="https://www.instagram.com/"><img src="images/instagram.png" alt="Instagram"></a>
    </nav>
  </footer>
</body>
</html>
